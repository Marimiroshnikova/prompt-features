<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt features</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Prompt features</h1>
    <span class="count" id="feature-count"></span>
  </div>
  <div class="backends" id="backends"></div>
</header>

<main>
  <section class="panel input-panel">
    <label class="label" for="prompt">Prompt</label>
    <textarea id="prompt" spellcheck="false" placeholder="Type or paste a prompt, then press Ctrl+Enter"></textarea>
    <div class="actions">
      <button id="run" class="primary">Extract features</button>
      <span class="hint">Ctrl+Enter</span>
      <span class="spacer"></span>
      <button id="copy-json" class="ghost" title="Copy all values as JSON">Copy JSON</button>
      <button id="download-csv" class="ghost" title="Download one row of values">CSV</button>
      <button id="download-report" class="ghost" title="Download the full calculation report">Report</button>
    </div>
    <label class="label" for="model" style="margin-top:14px">Model — fills groups 2 and 3, and the baseline</label>
    <select id="model">
      <option value="">Prompt only — pick a model for Model, Interaction, and baseline</option>
    </select>
    <label class="label" for="category" style="margin-top:10px">Subject — optional, for model × subject</label>
    <select id="category">
      <option value="">No subject</option>
    </select>
    <div class="samples">
      <span class="label small">Try one</span>
      <div id="samples" class="chips"></div>
    </div>
    <p id="error" class="error" hidden></p>
  </section>

  <section id="results" class="results" hidden>
    <div class="summary" id="summary"></div>

    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-view="top">Top 30</button>
        <button class="tab" data-view="plan">3 groups</button>
        <button class="tab" data-view="all">All features</button>
        <button class="tab" data-view="issues">Not computed</button>
      </div>
      <input id="filter" type="search" placeholder="Filter by name or meaning" />
      <label class="toggle"><input type="checkbox" id="only-active" /> Only meaningful values</label>
      <button id="expand-all" class="ghost small">Expand all</button>
    </div>

    <div id="feature-list"></div>
  </section>

  <section id="empty" class="empty">
    <p>Every number is computed from the prompt text, and can be expanded to show how it was reached. <strong>3 groups</strong> is Prompt, Model, and Interaction. Pick a model to also see the <strong>baseline</strong>: that model's miss rate on the 280-question grid.</p>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
